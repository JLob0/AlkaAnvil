# AlkaAnvil - Layouts de GUI (posicoes configuraveis)
# Regras:
#   # = borda preta (preenche automatico via applyBorder)
#   _ = vazio (nunca preenchido, nem por borda)
#   Letras = slots controlados pelo Java (conteudo/acao fixa) - texto/icone de cada
#            letra fica em menus.yml (chave descritiva, nao a letra em si)
#   0 = slot de lista dinamica (campos da secao, quantidade variavel)

alkaanvil-admin:
  rows: 3
  layout:
    - "_________"
    - "_ABCDEFG_"
    - "_H______X"
  # A=custo-limites B=encant-limites C=penalidade-uso D=reparo-unidade E=disenchant-shatter
  # F=item-stats G=custo-moeda H=conflitos-encant X=fechar

alkaanvil-section:
  rows: 4
  layout:
    - "_________"
    - "_0000000_"
    - "_0000000_"
    - "____V____"
  # 0=campo da secao (dinamico, ate 14), V=voltar

alkaanvil-bigorna:
  rows: 1
  layout:
    - "_#_#C#R##"
  # slot 1 (indice 0) = item A, slot 3 (indice 2) = item B, slot 5 (indice 4) = custo,
  # slot 7 (indice 6) = resultado final. Resto = borda (vidro preto, trocavel por
  # item custom em menus.yml -> common.border).
  # _ = slot livre (item do jogador, nunca controlado por Java)
  # C = medidor de custo (icone dinamico: niveis/moeda necessarios, se tem ou nao, quanto sobra)
  # R = resultado final/confirmar (clicar entrega o item, incluindo sobra de disenchant/shatter
  #     se houver, e cobra o custo)
